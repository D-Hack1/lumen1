      are height relative to the same 1737400 m sphere. A full-window DEM
      pixel-data read for this product (beyond the 1 km fallback window)
      is currently blocked: GDAL's /vsicurl/ range-request reads for the
      production crop window fail with a reproducible HTTP 403 after a
      small number of successful 206 Partial Content reads (observed:
      3 successful range reads then 403, repeatable). A lightweight
      metadata-only open (no pixel data) succeeds in under 1 second.
