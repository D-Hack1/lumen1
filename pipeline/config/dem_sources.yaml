  polar_10m_lola_pgda_90:
    name: "Polar 10 m LOLA 83-90S mosaic"
    provider: "PGDA"
    product_id: 90
    source_page: "https://pgda.gsfc.nasa.gov/products/90"
    resolution_m: 10.0
    latitude_coverage: "83S-90S"
    format: "GeoTIFF"
    dem_url: "https://pgda.gsfc.nasa.gov/data/LOLA_20mpp/LDEM_83S_10MPP_ADJ.TIF"
    error_url: "https://pgda.gsfc.nasa.gov/data/LOLA_20mpp/LDEM_83S_10MPP_ADJ_ERR.TIF"
    slope_url: null
    frame: "MOON_ME / DE421"
    datum_reference: "1737400 m reference sphere"
    unit: "m"
    scale: 1.0
    offset: 0.0
    nodata: .nan
    vertical_reference: "height_relative"
    error_unit: "m"
    error_scale: 1.0
    error_offset: 0.0
    error_nodata: .nan
    error_vertical_reference: "height_relative"
    format_metadata:
      cog: true
      elevation_unit: "m"
      coordinate_system: "south-polar stereographic"
    availability_status: "verified_product"
    verification_status: "source_page_and_urls_provided"
    notes: >
      DEM and matching ERR grids were inspected. CRS, transform, dimensions,
      resolution and nodata match. DEM history records kilometre-to-metre
      conversion. Shackleton radial coverage and a 5 km DemReader window
      were verified, including a successful matching ERR read. Error values
      are uncertainty magnitudes; no sphere subtraction is applied to them.
      Effective LOLA support is not uniform across the nominal 10 m grid.
      Shackleton count-map inspection showed approximately 34 percent
      directly supported pixels in the near-field crop. Direct GDAL/rasterio
      inspection of LDEM_83S_10MPP_ADJ.TIF confirms its CRS is IAU
      authority code 30100 ("Moon (2015) - Sphere / Ocentric"), ellipsoid
      radius exactly 1737400 m, flattening 0 -- the same sphere this
      datum_reference names. Its embedded GMT processing history tag
      ("gmt grdmath ldem_83s_final_adj_10mpp_surf.grd 1000.0 MUL") confirms
      the stored z values are a *_surf.grd grid multiplied by 1000 (the
      kilometre-to-metre conversion), consistent with height relative to
      that same sphere. This is strong supporting evidence, not yet a
      literal textual confirmation from the product's cited reference
      (Barker et al. 2023, Planet. Sci. J. 4, 183, DOI 10.3847/PSJ/acf3e1):
      that paper was not reachable from this environment to read directly.
      Formal vertical-datum confirmation remains outstanding pending that
      reading (or an equivalent authoritative source).

