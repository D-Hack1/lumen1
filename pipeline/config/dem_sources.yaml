  earth_visibility_65S_240m_pgda_69:
    name: "Average Earth visibility, 65S-90S, 240 m/px"
    provider: "PGDA"
    product_id: 69
    source_page: "https://pgda.gsfc.nasa.gov/products/69"
    url: "https://pgda.gsfc.nasa.gov/data/MoonIllumination/AVGVISIB_65S_240M_201608_EARTH.TIF"
    resolution_m: 240.0
    latitude_coverage: "65S-90S"
    format: "GeoTIFF"
    crs: "south-polar stereographic, R=1737400 m, true scale at pole (+proj=stere +lat_0=-90 +lat_ts=-90 +lon_0=0 +R=1737400 +units=m)"
    dtype: "int16"
    scale: 4.0e-05
    offset: 0.0
    nodata: -32768
    value_meaning: "fraction of time any part of the Earth disc is above the local LOLA-topography horizon, in [0, 1], averaged hourly over an 18.6-year lunar nutation cycle"
    citation: "Mazarico, E., et al. (2011), Icarus, Vol. 211, pp. 1066-1081, doi:10.1016/j.icarus.2010.10.030"
    availability_status: "verified_product"
    verification_status: "live_opened_and_inspected"
    notes: >
      Same grid/CRS as avg_illumination_65S_240m_pgda_69 (identical
      transform and size), confirmed by direct inspection. Page text
      states Earth is counted visible "if any part of its disc is not
      obscured", noted here as a known limitation (slightly optimistic vs.
      a DSN-station-only link study). This product already accounts for
      local LOLA-DEM topographic horizon occlusion (it is the Earth-disc
      analogue of the solar-illumination computation, both run over the
      same LOLA elevation grid per the page text), so it satisfies the S-7
      contract's "local terrain occlusion" requirement without needing a
      separate ephemeris + per-pixel horizon raycast in this pipeline.

