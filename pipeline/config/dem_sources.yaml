# S-7 regional layer products (owner: Shiva Shakthi).
#
# These are classification/fraction rasters (illumination, Earth visibility,
# permanent-shadow), not elevation data, so they are kept in a separate
# section with their own schema rather than forced into the elevation-centric
# `products` block above (which assumes a `vertical_reference` and sphere
# subtraction that do not apply here). Every entry below was independently
# opened live via rasterio/vsicurl and inspected (CRS, transform, dtype,
# nodata, GDAL-reported per-band scale/offset) before being recorded; no
# value here is assumed from the product's filename or webpage prose alone.
#
# Source: PGDA "Lunar Polar Illumination" (Mazarico), product page
# https://pgda.gsfc.nasa.gov/products/69 . Required citation: Mazarico, E.,
# et al. (2011), "Illumination conditions of the lunar polar regions using
# LOLA topography", Icarus, Vol. 211, pp. 1066-1081,
# doi:10.1016/j.icarus.2010.10.030 . Per the page text: all three families
# below (average solar illumination, Earth visibility, permanent shadow)
# are computed from LOLA topography over an entire lunar nutation cycle
# (~18.6 years) at an hourly timestep, in south-polar-stereographic
# projection with reference radius 1737.4 km and true scale at the pole
# (same CRS/radius convention as the elevation products above). The page's
# "New (2025/03/20)" note states the linked `_COG.TIF` files are meant to be
# GeoTIFF/COG conversions of the IMG products; at verification time
# (2026-11-15) every `_COG.TIF` URL returned HTTP 200 with
# Content-Type: text/html (an error/placeholder page, confirmed via HEAD
# request), not a TIFF. The plain (non-COG) `.TIF` URLs used below returned
# real image/tiff content and were opened successfully; this discrepancy is
# recorded here rather than silently worked around.
regional_layer_products:
  avg_illumination_65S_240m_pgda_69:
    name: "Average solar illumination, 65S-90S, 240 m/px"
    provider: "PGDA"
    product_id: 69
    source_page: "https://pgda.gsfc.nasa.gov/products/69"
    url: "https://pgda.gsfc.nasa.gov/data/MoonIllumination/AVGVISIB_65S_240M_201608.TIF"
    resolution_m: 240.0
    latitude_coverage: "65S-90S"
    format: "GeoTIFF"
    crs: "south-polar stereographic, R=1737400 m, true scale at pole (+proj=stere +lat_0=-90 +lat_ts=-90 +lon_0=0 +R=1737400 +units=m)"
    dtype: "int16"
    scale: 4.0e-05
    offset: 0.0
    nodata: -32768
    value_meaning: "fraction of time illuminated by the Sun, in [0, 1], averaged hourly over an 18.6-year lunar nutation cycle (centred ~2016-08 per filename)"
    citation: "Mazarico, E., et al. (2011), Icarus, Vol. 211, pp. 1066-1081, doi:10.1016/j.icarus.2010.10.030"
    availability_status: "verified_product"
    verification_status: "live_opened_and_inspected"
    notes: >
      Opened live via /vsicurl/: 6420x6420 px, transform origin
      (-770400, 770400), confirming 65S-90S coverage via the polar
      stereographic radius formula rho=2R*tan(colat/2) (rho=770400 m ->
      colat=25.06 deg -> lat=-64.94 deg =~ -65). GDAL-reported per-band
      scale=4e-05, offset=0.0 (read via rasterio dataset.scales/.offsets,
      not the filename or page prose). A 200x200 px native-resolution
      window near the pole was 100% finite after nodata masking, with
      decoded (raw*scale+offset) values in [0, ~0.935], consistent with a
      0-1 fraction. No embedded unit tag was present, so the "fraction in
      [0,1]" interpretation rests on the scale/offset bounding to <=~1.0
      and the page's description of these as the solar-illumination
      analogue of Mazarico et al. (2011)'s published percentages; this
      inference is documented, not a bare assumption, but is weaker than
      the slope raster's embedded CF tag and should be revisited if a PDS
      label is obtained.

