[project]
name = "lumen-pipeline"
version = "0.1.0"
description = "LUMEN build-time data pipeline (ephemeris, DSN, terrain, validation)."
requires-python = ">=3.11"
dependencies = [
    "spiceypy",
    "skyfield",
    "numpy",
    "scipy",
    "numba",
    "rasterio",
    "pyproj",
    "shapely",
    "pyogrio",
    "pyyaml",
    "requests",
    "matplotlib",
    "pillow",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "black"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["lumen_pipeline*"]
