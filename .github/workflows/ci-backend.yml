name: Backend CI

on:
  push:
    paths:
      - "pipeline/**"
      - "web/public/data/**"
      - ".github/workflows/ci-backend.yml"
  pull_request:
    paths:
      - "pipeline/**"
      - "web/public/data/**"
      - ".github/workflows/ci-backend.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Hydrate and verify ephemeris LFS artifact
        shell: bash
        run: |
          set -euo pipefail
          git -C .. lfs pull
          ephem="../web/public/data/ephem/ephem.bin"
          test "$(stat --printf='%s' "$ephem")" -eq 3366144
          if head -c 64 "$ephem" | grep -q '^version https://git-lfs.github.com/spec/v1'; then
            echo "ephem.bin is still a Git LFS pointer after hydration" >&2
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Download locked SPICE kernels
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p kernels
          declare -A urls=(
            [naif0012.tls]=https://naif.jpl.nasa.gov/pub/naif/generic_kernels/lsk/naif0012.tls
            [pck00011.tpc]=https://naif.jpl.nasa.gov/pub/naif/generic_kernels/pck/pck00011.tpc
            [de421.bsp]=https://naif.jpl.nasa.gov/pub/naif/MAVEN/kernels/spk/de421.bsp
            [moon_pa_de421_1900-2050.bpc]=https://naif.jpl.nasa.gov/pub/naif/generic_kernels/pck/moon_pa_de421_1900-2050.bpc
            [moon_080317.tf]=https://naif.jpl.nasa.gov/pub/naif/generic_kernels/fk/satellites/moon_080317.tf
          )
          for filename in "${!urls[@]}"; do
            curl --fail --location --retry 3 --retry-all-errors --output "kernels/$filename" "${urls[$filename]}"
            test -s "kernels/$filename"
          done
          grep -q '^KPL/LSK' kernels/naif0012.tls
          grep -q '^KPL/PCK' kernels/pck00011.tpc
          grep -q '^KPL/FK' kernels/moon_080317.tf
          test "$(head -c 7 kernels/de421.bsp)" = "DAF/SPK"
          test "$(head -c 7 kernels/moon_pa_de421_1900-2050.bpc)" = "DAF/PCK"
      - run: ruff check .
      - run: pytest
