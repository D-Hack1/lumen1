name: Backend CI

on:
  push:
    paths:
      - "pipeline/**"
      - "web/public/data/**"
      - ".github/workflows/ci-backend.yml"
  pull_request:
    paths:
      - "pipeline/**"
      - "web/public/data/**"
      - ".github/workflows/ci-backend.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Hydrate and verify ephemeris LFS artifact
        shell: bash
        run: |
          set -euo pipefail
          git -C .. lfs pull
          ephem="../web/public/data/ephem/ephem.bin"
          test "$(stat --printf='%s' "$ephem")" -eq 3366144
          if head -c 64 "$ephem" | grep -q '^version https://git-lfs.github.com/spec/v1'; then
            echo "ephem.bin is still a Git LFS pointer after hydration" >&2
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - name: Cache verified SPICE kernels
        uses: actions/cache@v4
        with:
          path: pipeline/kernels
          key: ${{ runner.os }}-spice-de421-${{ hashFiles('pipeline/scripts/provision_kernels.py') }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Provision and verify locked SPICE kernels
        run: python scripts/provision_kernels.py
      - run: ruff check .
      - run: pytest
