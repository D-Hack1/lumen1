# Deploys the static web app to Azure Static Web Apps on every push to main (and on demand).
#
# ONE-TIME SETUP:
#   1. Azure Portal -> Create a resource -> Static Web App (Free plan, deployment source "Other" -- this workflow does the deploy).
#   2. In the new resource: Overview -> "Manage deployment token" -> copy it.
#   3. GitHub repo -> Settings -> Secrets and variables -> Actions -> New secret
#      Name: AZURE_STATIC_WEB_APPS_API_TOKEN   Value: <the token>
#
# We build here (not in Azure's builder) because the data files are Git LFS objects: this job checks out with lfs: true,
# so the app ships real data. Azure only receives the finished, pruned dist/ folder.
name: Deploy (Azure Static Web Apps)

on:
  workflow_dispatch: # manual only: each run downloads the Git LFS data, which counts against the LFS bandwidth quota

concurrency:
  group: azure-swa
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true # ephem.bin, dsn.bin, masks, sigma ... are Git LFS objects
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Verify the LFS data is real (a pointer file would ship a broken app)
        working-directory: web
        run: node scripts/vercel-check-data.mjs
      - name: Install
        working-directory: web
        run: npm ci
      - name: Build (real data, served from the site root)
        working-directory: web
        run: npm run build
        env:
          VITE_BASE: /
          VITE_LUMEN_DATA: real
      - name: Prune files the app never loads (keeps dist/ well under the 250 MB Free-plan limit)
        working-directory: web
        run: node scripts/vercel-prune-dist.mjs
      - name: Upload to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: web/dist
          skip_app_build: true
          skip_api_build: true
